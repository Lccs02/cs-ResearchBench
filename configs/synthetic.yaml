# SYNTHETIC SOFTWARE FIXTURES ONLY; not paper results.
schema_version: '1.0'
runs:
- run_id: synthetic-baseline-42
  project: synthetic-demo
  dataset: synthetic-normal-v1
  model: baseline
  seed: 42
  split: test
  evaluation_id: synthetic-elements-v1
  config:
    noise_scale: 0.4
  data_kind: synthetic
  input:
    path: ../examples/generated/baseline_42.csv
    format: csv
    mapping:
      target: observed
      prediction: estimated
      weights: importance
    expected_shape:
    - 24
  evaluation:
    mode: predictions
    missing: error
    statistical_unit: selected scalar element
    units: synthetic units
